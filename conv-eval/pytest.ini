[pytest]
testpaths = evals
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -v --tb=short
markers =
    smoke: fast sanity checks — run on every push
    regression: full evaluation suite — run nightly
    safety: out-of-scope and adversarial prompt handling checks
    retention: context retention and memory across conversation turns
    canary: negative-control tests — validate metrics detect known-bad inputs
