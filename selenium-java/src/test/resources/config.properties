# ============================================================
# 1. EXECUTION CONTROL
# ============================================================
execution_mode=local
browser=chrome
headless=false

# ============================================================
# 2. WEB APPLICATION
# ============================================================
url=https://www.saucedemo.com/
# Keys match ConfigReader.getProperty("app_username") / ("app_password") calls in tests.
# Override at runtime via env vars APP_USERNAME / APP_PASSWORD, or -Dapp_username=...
app_username=standard_user
app_password=secret_sauce

# Negative-test account (locked_out_user is a built-in SauceDemo test persona)
locked_out_username=locked_out_user

# Data-driven login personas used by DashboardTest DataProvider
persona.standard=standard_user
persona.problem=problem_user
persona.performance=performance_glitch_user

# ============================================================
# 3. TIMEOUTS
# ============================================================
timeout.explicit=20
timeout.implicit=10
retry.max=2

# ============================================================
# 4. API
# ============================================================
# Base URL only — tests append the specific resource path (e.g. /users/1)
api.base.url=https://jsonplaceholder.typicode.com

# ============================================================
# 5. MOBILE CONFIGURATION
# ============================================================
appium_url=http://127.0.0.1:4723
android_app_path=src/test/resources/apps/Android.SauceLabs.Mobile.Sample.app.2.7.1.apk
ios_app_path=src/test/resources/apps/iOS.Simulator.SauceLabs.Mobile.Sample.app.2.7.1.app

# MUST match your AVD/Simulator names
android_device_name=Google Pixel 8
ios_device_name=iPhone 15
ios_version=17.0

# ============================================================
# 6. INFRASTRUCTURE (Grid & Cloud)
# ============================================================
grid_url=http://localhost:4444
hub.url=http://localhost:4444
cloud_grid_url=https://ondemand.us-west-1.saucelabs.com:443/wd/hub

# Cloud credentials are read from env vars SAUCE_USERNAME and SAUCE_ACCESS_KEY
# (mapped explicitly in ConfigReader.ENV_VAR_ALIASES).
# Leave these blank — do NOT commit real credentials here.
cloud_username=
cloud_key=

# ============================================================
# 7. DATABASE CONFIGURATION
# ============================================================
db.url=jdbc:mysql://localhost:3306/saucedemo_test_db
db.user=root
db.password=${LOCAL_DB_PASSWORD}

# ============================================================
# 8. AI / LLM CONFIGURATION
# ============================================================
ai.model=gpt-4o-mini

# ============================================================
# 9. BROWSERSTACK APP IDs
# ============================================================
browserstack.android.app.id=QA_Director_Android_Build
browserstack.ios.app.id=QA_Director_iOS_Build

# ============================================================
# 10. AUTH TOKEN CONFIGURATION
# ============================================================
# Set api.auth.url to enable suite-level bearer token generation.
# AuthService posts credentials here once in @BeforeSuite and stores
# the result in TokenManager for all API tests to share.
#
# Leave api.auth.url blank to skip generation entirely (safe default).
# All tests continue normally; API tests run without an Authorization header.
#
# Supply credentials via environment variables — never commit real values here:
#   API_AUTH_USERNAME — maps to api.auth.username
#   API_AUTH_PASSWORD — maps to api.auth.password
#
# Supported response token fields (tried in order):
#   { "token": "..." }         — Django REST, simple APIs
#   { "access_token": "..." }  — OAuth 2.0 standard
#   { "accessToken": "..." }   — Spring Boot, many enterprise APIs
api.auth.url=
api.auth.username=${API_AUTH_USERNAME}
api.auth.password=${API_AUTH_PASSWORD}
