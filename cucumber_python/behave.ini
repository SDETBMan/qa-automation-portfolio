# ============================================================
# behave.ini -- Behave (Python Cucumber) configuration
#
# Replaces: TestRunner.java + config.properties (execution control)
# ============================================================

[behave]

# -- Paths ----------------------------------------------------
# Where Behave looks for .feature files
paths = features

# -- Step definitions and hooks discovery ---------------------
# Behave expects steps in features/steps/ by convention.
# environment.py is discovered directly inside features/.

# -- Formatter / Reporting ------------------------------------
# Default reporters: pretty console output + JUnit XML for CI upload
format   = allure_behave.formatter:AllureFormatter
           pretty
outfiles = reports/allure-results
           -

# -- JUnit XML output (for DataDog CI Visibility upload) ------
junit          = true
junit_directory = reports/junit

# -- Tag filtering --------------------------------------------
# Run all tags by default; override on CLI: behave --tags @smoke
# tags =

# -- Verbose output -------------------------------------------
# show_timings = true shows per-step durations in the console
show_timings = true

# -- Stop on first failure (useful for local debug) -----------
# stop = true   -- uncomment to enable fail-fast

# -- Dry-run (check step definitions without running tests) ---
# dry_run = false

# -- Summary --------------------------------------------------
summary = true
