# ============================================================
# config.ini — Framework configuration
#
# Priority (highest → lowest):
#   1. Environment variables  (e.g. TARGET=grid)
#   2. This file
#
# Replaces: config.properties from the Java Cucumber framework
# ============================================================

[execution]
# Override via env var: TARGET=grid|browserstack|android|ios
target   = local
browser  = chrome
headless = false

[web]
url                = https://www.saucedemo.com/
app_username       = standard_user
app_password       = secret_sauce
locked_out_username = locked_out_user

[api]
base_url = https://jsonplaceholder.typicode.com

[timeouts]
explicit = 10
implicit = 5

[grid]
url = http://localhost:4444/wd/hub

[browserstack]
# Credentials are read from BS_USER / BS_KEY environment secrets.
# Leave blank — do NOT commit real credentials here.
user =
key  =

[healenium]
# Healenium REST proxy — self-healing locators backend
# When running via Docker Compose, this points to the hlm-proxy service.
# Set HEALENIUM_ENABLED=true env var to activate.
proxy_url = http://localhost:8085
enabled   = false

[database]
url      = mysql+mysqlconnector://root:${LOCAL_DB_PASSWORD}@localhost:3306/saucedemo_test_db
