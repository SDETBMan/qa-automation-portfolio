name: Deploy → Validate → Rollback

# ─────────────────────────────────────────────────────────────────────────────
# Full deploy pipeline with health-check validation and automatic rollback.
#
# Flow:
#   1. Accept a Vercel deployment URL (or trigger a deploy)
#   2. Wait for the deployment to become ready
#   3. Run health checks (HTTP + Playwright smoke tests)
#   4. PASS → optionally promote to production
#   5. FAIL → rollback to previous successful deployment via Vercel API
#   6. Post result summary
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Deployment URL to validate (e.g. https://my-app-abc123.vercel.app)'
        required: true
        type: string
      vercel_project_id:
        description: 'Vercel project ID (for rollback)'
        required: false
        type: string
      auto_rollback:
        description: 'Automatically rollback on failure'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      deployment_url:
        required: true
        type: string
      vercel_project_id:
        required: false
        type: string
      auto_rollback:
        required: false
        type: boolean
        default: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  # ── Step 1: Health Checks ──────────────────────────────────────────────────
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    outputs:
      health_passed: ${{ steps.health.outputs.passed }}
      health_report: ${{ steps.health.outputs.report }}

    defaults:
      run:
        working-directory: playwright/tests/playwright-ts

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: playwright/tests/playwright-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run health check script
        id: health
        continue-on-error: true
        run: |
          set +e
          REPORT=$(npx ts-node scripts/health-check.ts "${{ inputs.deployment_url }}" 2>&1)
          EXIT_CODE=$?
          set -e

          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -eq 0 ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Playwright smoke tests against deployment
        id: smoke
        continue-on-error: true
        run: |
          npx playwright test tests/smoke-health.spec.ts \
            --project=chromium \
            --retries=1 \
            --reporter=github,list,html
        env:
          BASE_URL: ${{ inputs.deployment_url }}
          CI: 'true'

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-health-report
          path: playwright/tests/playwright-ts/playwright-report/
          retention-days: 14

      - name: Upload snapshot diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-health-diffs
          path: playwright/tests/playwright-ts/test-results/
          retention-days: 7

  # ── Step 2: Rollback on Failure ────────────────────────────────────────────
  rollback:
    name: Rollback (on failure)
    runs-on: ubuntu-latest
    needs: health-check
    if: |
      needs.health-check.outputs.health_passed != 'true' &&
      inputs.auto_rollback == true &&
      inputs.vercel_project_id != ''

    steps:
      - name: Find previous successful deployment
        id: find_previous
        run: |
          echo "Finding previous successful deployment for project ${{ inputs.vercel_project_id }}..."

          # List recent deployments, find the latest 'READY' one that isn't the current URL
          DEPLOYMENTS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=${{ inputs.vercel_project_id }}&limit=10&state=READY")

          # Extract the first deployment ID that isn't the current one
          PREVIOUS_ID=$(echo "$DEPLOYMENTS" | \
            jq -r --arg url "${{ inputs.deployment_url }}" \
            '[.deployments[] | select(.url != ($url | ltrimstr("https://")))] | .[0].uid // empty')

          if [ -z "$PREVIOUS_ID" ]; then
            echo "No previous successful deployment found. Skipping rollback."
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "Found previous deployment: $PREVIOUS_ID"
            echo "found=true" >> $GITHUB_OUTPUT
            echo "deployment_id=$PREVIOUS_ID" >> $GITHUB_OUTPUT
          fi

      - name: Rollback to previous deployment
        if: steps.find_previous.outputs.found == 'true'
        run: |
          DEPLOYMENT_ID="${{ steps.find_previous.outputs.deployment_id }}"
          echo "Rolling back to deployment: $DEPLOYMENT_ID"

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID/rollback")

          echo "Rollback response:"
          echo "$RESPONSE" | jq .

          # Log for audit trail
          echo "::notice::Rollback initiated to deployment $DEPLOYMENT_ID at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Log rollback audit entry
        if: steps.find_previous.outputs.found == 'true'
        run: |
          echo "=== ROLLBACK AUDIT LOG ==="
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Project: ${{ inputs.vercel_project_id }}"
          echo "Failed URL: ${{ inputs.deployment_url }}"
          echo "Rolled back to: ${{ steps.find_previous.outputs.deployment_id }}"
          echo "Trigger: Automated (health check failure)"
          echo "========================="

  # ── Step 3: Summary ────────────────────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [health-check, rollback]
    if: always()

    steps:
      - name: Post summary
        run: |
          echo "## Deploy Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment URL** | ${{ inputs.deployment_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health Check** | ${{ needs.health-check.outputs.health_passed == 'true' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Rollback** | ${{ needs.rollback.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.health-check.outputs.health_passed }}" != "true" ]; then
            echo "### Health Check Report" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            echo "${{ needs.health-check.outputs.health_report }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
