name: Site Drift Monitor

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC
  push:
    branches: [main]
    paths: ['site-monitor/**']
  pull_request:
    branches: [main]
    paths: ['site-monitor/**']
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-monitor

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: site-monitor/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  drift-check:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: site-monitor

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: site-monitor/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run drift check
        run: python run.py --auto-issue --output drift-report.md
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-report
          path: site-monitor/drift-report.md
          retention-days: 30
