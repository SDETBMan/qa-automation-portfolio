name: Pact Contract Tests

on:
  push:
    branches: [main]
    paths:
      - 'pact-consumer/**'
      - 'fastapi-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'pact-consumer/**'
      - 'fastapi-service/**'
  workflow_dispatch:

jobs:
  consumer:
    name: Pact Consumer Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pact-consumer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pact-consumer/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run consumer contract tests
        run: npm test

      - name: Upload pact files
        uses: actions/upload-artifact@v4
        with:
          name: pact-files
          path: pact-consumer/pacts/
          retention-days: 7

  provider:
    name: Pact Provider Verification
    needs: consumer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: fastapi-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download pact files
        uses: actions/download-artifact@v4
        with:
          name: pact-files
          path: pact-consumer/pacts/

      - name: Verify provider against pacts
        run: pytest tests/test_pact_provider.py -v
