name: postman-newman CI

on:
  push:
    branches: [ main ]
    paths: [ 'postman/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'postman/**' ]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      folder:
        description: 'Newman folder to run (Smoke | Users | Posts | Integration Flow — blank runs all)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: postman

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and reporters
        run: npm install

      - name: Run Newman collection
        run: |
          if [ -n "${{ github.event.inputs.folder }}" ]; then
            npx newman run collections/jsonplaceholder.postman_collection.json \
              -e environments/jsonplaceholder.postman_environment.json \
              --folder "${{ github.event.inputs.folder }}" \
              --reporters cli,junit \
              --reporter-junit-export results/newman-results.xml
          else
            npm test
          fi

      # ── DataDog CI Visibility ────────────────────────────────────────────
      - name: Upload test results to Datadog CI Visibility
        if: always()
        continue-on-error: true
        run: |
          curl -fsSL "https://github.com/DataDog/datadog-ci/releases/latest/download/datadog-ci_linux-x64" \
            --output /usr/local/bin/datadog-ci && chmod +x /usr/local/bin/datadog-ci
          datadog-ci junit upload --service qa-automation-portfolio \
            --tags framework:postman-newman \
            results/newman-results.xml
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DATADOG_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}

      - name: Upload Newman JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-newman-results
          path: postman/results/newman-results.xml
          retention-days: 30
