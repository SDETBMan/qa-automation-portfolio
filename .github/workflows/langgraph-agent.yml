name: LangGraph Agent — Test Case Generator

# ──────────────────────────────────────────────────────────────────────────────
# COST-SAFE DESIGN
#   Tier 1 (lint):  always runs on push/PR — no API calls, zero cost.
#   Tier 2 (demo):  only on workflow_dispatch — calls Anthropic, < $0.02 per run.
#
# Auto-recharge for API credits is disabled; the demo job will never run
# automatically, so there is no risk of unintended spend.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'langgraph-agent/**'
      - '.github/workflows/langgraph-agent.yml'
  pull_request:
    branches: [main]
    paths:
      - 'langgraph-agent/**'
      - '.github/workflows/langgraph-agent.yml'
  workflow_dispatch:

jobs:
  # ── Tier 1: lint + import smoke test (always free) ──────────────────────────
  lint:
    name: Lint (ruff + import check)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: langgraph-agent

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: langgraph-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Ruff lint
        run: ruff check . --select E,F,W --ignore E501

      - name: Import smoke test
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from graph.state import AgentState
          from graph.edges import review_router
          from graph.pipeline import build_graph
          print('All imports OK')
          "

  # ── Tier 2: full demo run (workflow_dispatch only) ───────────────────────────
  demo:
    name: Demo — Test Case Generator pipeline
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 15

    defaults:
      run:
        working-directory: langgraph-agent

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: langgraph-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run demo (built-in feature description)
        run: python run.py --demo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload generated test cases
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: langgraph-test-cases-${{ github.run_id }}
          path: langgraph-agent/output/
          retention-days: 7
