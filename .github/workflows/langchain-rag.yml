name: LangChain RAG — QA Portfolio Assistant

# ──────────────────────────────────────────────────────────────────────────────
# COST-SAFE DESIGN
#   Tier 1 (lint):  always runs on push/PR — no API calls, zero cost.
#   Tier 2 (demo):  only on workflow_dispatch — calls OpenAI, < $0.01 per run.
#
# Auto-recharge for API credits is disabled; the demo job will never run
# automatically, so there is no risk of unintended spend.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'langchain-rag/**'
      - '.github/workflows/langchain-rag.yml'
  pull_request:
    branches: [main]
    paths:
      - 'langchain-rag/**'
      - '.github/workflows/langchain-rag.yml'
  workflow_dispatch:

jobs:
  # ── Tier 1: lint + import smoke test (always free) ──────────────────────────
  lint:
    name: Lint (ruff + import check)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: langchain-rag

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: langchain-rag/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Ruff lint
        run: ruff check . --select E,F,W --ignore E501

      - name: Import smoke test
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from rag.loader import load_corpus
          from rag.vectorstore import build_vectorstore
          from rag.chain import build_chain, get_session_history
          print('All imports OK')
          "

  # ── Tier 2: full demo run (workflow_dispatch only) ───────────────────────────
  demo:
    name: Demo — RAG pipeline (3 questions)
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 10

    defaults:
      run:
        working-directory: langchain-rag

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: langchain-rag/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run demo (3 built-in questions)
        run: python run.py --demo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: langchain-rag-output-${{ github.run_id }}
          path: langchain-rag/output/
          retention-days: 7
