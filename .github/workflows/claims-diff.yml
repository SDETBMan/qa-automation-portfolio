name: Claims Diff

on:
  push:
    branches: [main]
    paths: ['claims-diff/**']
  pull_request:
    paths: ['claims-diff/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claims-diff

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: claims-diff/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/ -v \
            --junit-xml=junit-report.xml \
            --cov=differ \
            --cov-report=xml

      - name: Run CLI (verify diff report)
        run: |
          python run.py && exit 1 || test $? -eq 1

      # -- DataDog CI Visibility -------------------------------------------
      - name: Upload test results to Datadog CI Visibility
        if: always()
        continue-on-error: true
        run: |
          curl -fsSL "https://github.com/DataDog/datadog-ci/releases/latest/download/datadog-ci_linux-x64" \
            --output /usr/local/bin/datadog-ci && chmod +x /usr/local/bin/datadog-ci
          datadog-ci junit upload --service qa-automation-portfolio \
            --tags framework:claims-diff \
            junit-report.xml
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DATADOG_SITE:    ${{ vars.DD_SITE || 'datadoghq.com' }}

      - name: Upload test artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claims-diff-results
          path: |
            claims-diff/junit-report.xml
            claims-diff/coverage.xml
          retention-days: 30
