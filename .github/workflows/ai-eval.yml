name: AI Eval

on:
  push:
    paths: ['ai-eval/**']
  pull_request:
    paths: ['ai-eval/**']
  schedule:
    - cron: '0 5 * * *'   # nightly 05:00 UTC
  workflow_dispatch:
    inputs:
      marker:
        description: 'pytest marker filter (smoke | regression | safety | leave blank for all)'
        required: false
        default: ''

jobs:
  evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-eval

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-eval/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI evaluations
        run: |
          if [ -n "${{ github.event.inputs.marker }}" ]; then
            pytest -m "${{ github.event.inputs.marker }}" -v
          else
            pytest -m smoke -v
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepeval-results
          path: ai-eval/.deepeval/
          retention-days: 30
