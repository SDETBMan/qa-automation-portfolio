name: AI Eval

on:
  push:
    paths: ['ai-eval/**']
  pull_request:
    paths: ['ai-eval/**']
  schedule:
    - cron: '0 5 * * *'   # nightly 05:00 UTC
  workflow_dispatch:
    inputs:
      marker:
        description: 'pytest marker filter (smoke | regression | safety | leave blank for all)'
        required: false
        default: ''

jobs:
  evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-eval

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-eval/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI evaluations
        run: |
          if [ -n "${{ github.event.inputs.marker }}" ]; then
            pytest -m "${{ github.event.inputs.marker }}" -v --junit-xml=junit-report.xml \
              --reruns 3 --reruns-delay 60
          else
            pytest -m smoke -v --junit-xml=junit-report.xml \
              --reruns 3 --reruns-delay 60
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DD_API_KEY:     ${{ secrets.DD_API_KEY }}
          # Disables DeepEval's internal 88.5s per-attempt timeout so slow OpenAI
          # API responses don't cause false CI failures. The GitHub Actions job
          # timeout (6 hours default) acts as the outer safety net instead.
          DEEPEVAL_DISABLE_TIMEOUTS: "true"

      # ── DataDog CI Visibility ────────────────────────────────────────────
      - name: Upload test results to Datadog CI Visibility
        if: always()
        continue-on-error: true
        run: |
          curl -fsSL "https://github.com/DataDog/datadog-ci/releases/latest/download/datadog-ci_linux-x64" \
            --output /usr/local/bin/datadog-ci && chmod +x /usr/local/bin/datadog-ci
          datadog-ci junit upload --service qa-automation-portfolio \
            --tags framework:ai-eval \
            junit-report.xml
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DATADOG_SITE: datadoghq.com

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepeval-results
          path: ai-eval/.deepeval/
          retention-days: 30
