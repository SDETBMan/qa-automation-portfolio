name: cucumber CI

on:
  push:
    branches: [ main ]
    paths: [ 'cucumber/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'cucumber/**' ]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cucumber

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Uncomment the appropriate setup step once the stack is decided:
