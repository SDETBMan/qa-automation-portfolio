name: cucumber CI

on:
  push:
    branches: [ main ]
    paths: [ 'cucumber/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'cucumber/**' ]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag filter (e.g. @smoke, @regression, @login)'
        required: false
        default: '@smoke or @regression'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cucumber

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Cucumber tests
        run: >
          mvn clean test
          -Dheadless=true
          -Dcucumber.filter.tags="${{ github.event.inputs.tags || '@smoke or @regression' }}"
        env:
          APP_USERNAME: standard_user
          APP_PASSWORD: secret_sauce

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-allure-results
          path: cucumber/target/allure-results/
          retention-days: 30

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: cucumber/target/cucumber-reports/
          retention-days: 7
