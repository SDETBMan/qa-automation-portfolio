name: DSPy Optimizer — Bug Severity Classifier

# ──────────────────────────────────────────────────────────────────────────────
# COST-SAFE DESIGN
#   Tier 1 (lint):  always runs on push/PR — no API calls, zero cost.
#   Tier 2 (demo):  only on workflow_dispatch — calls OpenAI, ~$0.02 per run.
#
# Auto-recharge for API credits is disabled; the demo job will never run
# automatically, so there is no risk of unintended spend.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'dspy-optimizer/**'
      - '.github/workflows/dspy-optimizer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dspy-optimizer/**'
      - '.github/workflows/dspy-optimizer.yml'
  workflow_dispatch:

jobs:
  # ── Tier 1: lint + import smoke test (always free) ──────────────────────────
  lint:
    name: Lint (ruff + import check)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: dspy-optimizer

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dspy-optimizer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Ruff lint
        run: ruff check . --select E,F,W --ignore E501

      - name: Import smoke test
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from classifier.signatures import BugSeveritySignature
          from classifier.modules import BugClassifier
          from classifier.optimizer import compile_with_bootstrap, evaluate
          from datasets.bug_reports import DATASET, TRAINSET, DEVSET
          assert len(DATASET) == 30, f'Expected 30 examples, got {len(DATASET)}'
          assert len(TRAINSET) == 20
          assert len(DEVSET) == 10
          print(f'All imports OK — {len(DATASET)} examples loaded')
          "

  # ── Tier 2: full compare run (workflow_dispatch only) ────────────────────────
  demo:
    name: Demo — baseline vs optimized accuracy comparison
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 20

    defaults:
      run:
        working-directory: dspy-optimizer

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dspy-optimizer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run comparison (baseline vs BootstrapFewShot optimized)
        run: python run.py --mode compare
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload compiled classifier
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dspy-compiled-${{ github.run_id }}
          path: dspy-optimizer/output/
          retention-days: 7
