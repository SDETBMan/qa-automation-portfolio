  - package-ecosystem: "pip"
    directory: "/agent-eval"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/job-agent"
    schedule:
