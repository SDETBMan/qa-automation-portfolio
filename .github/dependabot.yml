version: 2

updates:
  # Python pip ecosystems
  - package-ecosystem: "pip"
    directory: "/fastapi-service"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/ai-eval"
    schedule:
      interval: "weekly"
    groups:
